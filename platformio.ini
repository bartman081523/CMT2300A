; PlatformIO project configuration for the CMT2300A driver
;
; The CMT2300A is a HopeRF (CMOSTEK) sub-GHz transceiver that connects to
; the ESP32 over a 4-wire SPI bus. This project demonstrates direct SPI
; register access, a packet-mode TX/RX API and a small WiFi/WebUI wrapper
; so you can drive it from a browser.
;
; See README.md for the full pin-out and command reference.

[env:esp32dev]
platform        = espressif32
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
build_flags     =
    -DCORE_DEBUG_LEVEL=3
    -DCMT2300A_DEBUG=1
    -DCMT2300A_USE_WEBUI=1
    ; OMS Wireless M-Bus T1 recording profile (868 MHz, 32.8 kbps, Manchester).
    ; Set to 0 to restore the EBYTE demo profile.
    -DCMT_OMS_T1=1

; SPI pin set. The CMT2300A needs two chip-selects (CSB for registers,
; FCSB for the FIFO) plus an interrupt pin. GPIO numbers can be changed
; below to match your wiring.
build_flags +=
    -DCMT_PIN_SCK=18
    -DCMT_PIN_MISO=19
    -DCMT_PIN_MOSI=23
    -DCMT_PIN_CSB=5
    -DCMT_PIN_FCSB=17
    -DCMT_PIN_INT1=4
    -DCMT_PIN_INT2=16

; ---------------------------------------------------------------------------
; ESP32-S3 + E49 dongle (sniffed wiring 2026-08-28: PD1/g7=SCK, PB2/g6=SDIO,
; PB0/g4=CSB). EE_7: FCSB auf Pin 8 (TP1/"NRST") — Pin 8 zeigt im Scan die
; einzige TX_DONE-/Flag-Aktivität. Pin 8 wird NICHT nach LOW gezogen
; (CMT_NRST_HOLD=0) — das LOW-hold bricht den Bus!
; ---------------------------------------------------------------------------
[env:esp32s3]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
build_flags     =
    -DCORE_DEBUG_LEVEL=3
    -DCMT2300A_DEBUG=1
    -DCMT2300A_USE_WEBUI=1
    ; CH343 UART bridge on UART0 -> Serial must go to UART0, not native USB
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCMT_OMS_T1=1
    -DCMT_T1_VARLEN=1
    -DCMT_SNIFF=0
    -DCMT_POLARITY_INV=0
    ; Runde 61 (2026-09-06) AUS: TX_TEST lief mit RX-Framing 0x45=0x40/0x46=0x6D
    ; (= 109-B-Fixlaenge) gegen einen 31-B-FIFO -> Engine verhungerte, Chip
    ; sass im TX-Wait (Lesevorgaenge 0x00), goTx() blockierte 1 s pro Aufruf
    ; (50 % CPU), Null RF-Bursts (r61-IQ-Scan), FIFO-Verschmutzung. TX laeuft
    ; produktiv ueber den HB-Beacon (rtl_433: QDS 1234567, Integrity CRC, 2x).
    -DCMT_TX_TEST=0
    -DCMT_PIN_FCSB_ALT=5
    -DCMT_NRST_HOLD=1
    -DCMT_STM8_BRIDGE_PROBE=0
    -DCMT_STM8_ONLY=0
    -DCMT_RX_STOCK_TEST=0
    -DCMT_RX_BISECT=0
    -DCMT_REGVAR=0
    -DCMT_RAWCAP=0
    -DCMT_SWFRAM=1
    -DCMT_BUFCAP=0
    ; Runde 79 (2026-09-07): rtlwmbus-Feed — BOK-Frames CRC-LESS strippen und
    ; als Zeile C1;1;1;<ts>;<rssi>;0;0x<hex> auf die UART (wmbusmeters-
    ; checkRTLWMBUSFrame-Grammatik; r74 offline bewiesen: 79/79 via stdin).
    -DCMT_WMBUS_FEED=1
    ; Runde 80 (2026-09-07): Per-Block-Bit-Repair — BBAD-Frames auf 1-Bit-Slip
    ; reparieren (Flip/Insert/Drop, verifiziert per EN13757-Block-CRC-Kette),
    ; Reparatur geht BOK-gated in den Feed. r78-Playbook-Hebel, r66-Slip-Law.
    -DCMT_WMBUS_REPAIR=1
    ; Runde 83 (2026-09-08) T-Mode-Probe: RX-Retune auf 868.3 MHz nach begin()
    ; (Flotten-Befund: qcaloric/qwater/unknown nur im Daemon-Wideband sichtbar
    ; = off-band bei uns). Nach dem Probe-Soak zurueck auf 0 (Produktivstand
    ; 868.95).
    -DCMT_TMODE_PROBE=0
    ; Runde 83h (2026-09-08) B1: Prod-Bank (100 kBd) + 2-Byte-Sync-Override
    ; 543D (0x3C=0x02) statt T1-Delta. Testet Hypothese (iii): T1-3of6-Frames
    ; @ 100 kBd @ 868.95, die die Produktiv-4B-Sync 543D-54CD prinzipbedingt
    ; ausschliesst (0x54 ist in keiner 3of6-Nibble-Tabelle ein Symbol).
    ; Runde 83j: Hebel orthogonal — Matrix (je 1 aktiv):
    ;   SYNC2B            = B1 (Prod-Bank + 2-B-Sync)   <- gelaufen, leer (83j:
    ;                       3of6 0/79452, M-Zensus nur 9344/2515)
    ;   BANK_T1+SYNC2B    = B2 (T1-32.8-Bank + 2-B-Sync)  <- aktuell: letzte
    ;                       stehende Hypothese (i); staerkste Lesart ist jetzt
    ;                       C1@32.768 NRZ @ 868.95 (rtl t1_c1 ist raten-adaptiv,
    ;                       83g-4B-Sync blockierte C1-L≠0x54, B1-100kBd-CDR
    ;                       verhunzt 32.768-Bits)
    ;   S1                = Probe A (65.5 kBd, Sync 33303F3C, 868.3) <- gelaufen,
    ;                       leer (0 Dumps/30 min bei 8 qcaloric on air)
    ;   RSSILOG           = Probe C (83k): RSSI-Envelope-Logger @ 868.95 —
    ;                       rate-agnostisch (0x6F = Energie vor CDR/Sync).
    ;                       Befund 83l: 7 decaps-Momente <-> Bursts, 2/7 >= 52
    ;                       (peak 58-59, dur 8-10 ms), 5/7 < 52; Flotten-Weak-
    ;                       Tail (min 54, 20/152 < 60) macht Rate-Schluss
    ;                       AMBIGU. 83m: 3694 Dumps, 0 C=0xC4/CRC1-OK an
    ;                       irgendeinem Alignment — Outer-Bytes nie im FIFO.
    ;-DCMT_PROBE_S1=1
    ; Runde 83n (2026-09-09) Probe D (AKTIV): SYNC2B+RSSILOG — B1-RX-Konfig
    ; (Prod-Bank 100 kBd + 2-B-Sync 543D) mit Envelope+SYNC_OK-Zahl+FIFO-
    ; Capture je Burst (main.cpp 83n-Block). Frage: sync't der Chip die
    ; LSE-Outer-Frames (C=0xC4, Envelope 52-59) oder blockt der Sync
    ; strukturell? Positivkontrolle bewiesen: [BRAW] 54 CD 37 44 93 44
    ; (qsmoke, erster Burst). Nach dem Soak zurueck auf Prod-Flags.
    ;-DCMT_PROBE_SYNC2B=1   (83q: Probe F konklusiv-negativ, Outers unter Sensitivity)
    ;-DCMT_PROBE_RSSILOG=1
    ; Runde 83p (2026-09-09) Probe E (nach dem 83n-Soak flashen): SYNC-
    ; getriggerte Capture OHNE RSSI-Gate — SYNC_OK (0x6D bit3) kontinuierlich
    ; pollen, bei Sync room-capped FIFO-Drain + [SCAP]/[SRAW] (main.cpp 83p-
    ; Block). Frage: locked der CDR die Outers unter der Envelope-Schwelle?
    ; Falls leer: Probe F (Frequenz-Offset-Sweep ±15 kHz). Nach dem Probe-
    ; Soak zurueck auf Prod-Flags.
    ;-DCMT_PROBE_SYNCCAP=1
    ; Runde 83q (2026-09-09) Probe F (nach dem 83p-Soak flashen): Frequenz-
    ; Offset-Zyklus — 5 Offsets (0, ±15, ±30 kHz) x 60 s am 868.95-Referenz,
    ; voller PLL-Retune je Wechsel ([ORET] = Timeline). Frage: sitzt der
    ; Outer-Traeger gegenueber unserer 26-MHz-Referenz off, sodass der
    ; narrowband Envelope unter THR drueckt und der CDR nie lockt (Probe E:
    ; 93 SCAP 93x cap=0, 0 Outer-Bytes in 769 BRAW, SCAPs reine Noise).
    ; Positivkontrolle: qsmoke-BRAWs je Offset (CDR-Capture-Range-Messung).
    ; SCAP-Prints tragen n20 (Envelope-Samples >20 im Fenster: Flat-Noise vs
    ; 10-ms-Frame-Profil). Falls ein Delta-neq0-SCAP Outer-Bytes liefert ->
    ; POC + Frequenz-Offset-Fix. Nach dem Probe-Soak zurueck auf Prod-Flags.
    ;-DCMT_PROBE_OFS=1
    -DCMT_WIFI_OFF=1
    -DCMT_PIN_NRST=8
    ; Sniff-verifizierte Zuordnung (STM8-Burst-Analyse 2026-08-28):
    ; PD1/g7 = SCK, PB2/g6 = SDIO, PB0/g4 = CSB, PB1/g5 = FCSB (unverifiziert!)
    -DCMT_PIN_SCK=7
    -DCMT_PIN_MISO=6
    -DCMT_PIN_MOSI=6
    -DCMT_PIN_CSB=4
    -DCMT_PIN_FCSB=5
    -DCMT_PIN_INT1=15
    -DCMT_PIN_INT2=16